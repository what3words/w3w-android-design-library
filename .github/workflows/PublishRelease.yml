name: Publish Release

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:    # Allow manual triggering

concurrency:
  group: publish-maven-central
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing key
        env:
          W3W_GPG_SECRET_KEY: ${{ secrets.W3W_GPG_SECRET_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.gradle/
          echo "GRADLE_USER_HOME=${HOME}/.gradle" >> "$GITHUB_ENV"
          # The stored secret is the base64-encoded, ASCII-armored private key.
          encoded_key="${W3W_GPG_SECRET_KEY//$'\r'/}"
          remainder=$(( ${#encoded_key} % 4 ))
          if (( remainder == 1 )); then
            echo "::error::W3W_GPG_SECRET_KEY is not valid base64"
            exit 1
          elif (( remainder > 1 )); then
            printf -v padding '%*s' "$((4 - remainder))" ''
            encoded_key+="${padding// /=}"
          fi

          signing_key="$(printf '%s' "$encoded_key" | base64 --decode)"
          if [[ "$signing_key" != *"-----BEGIN PGP PRIVATE KEY BLOCK-----"* ]]; then
            echo "::error::W3W_GPG_SECRET_KEY did not decode to an ASCII-armored private key"
            exit 1
          fi

          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<__EOF__"
            printf '%s\n' "$signing_key"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Publish to Maven Central
        run: ./gradlew :design-library:publishToMavenCentral --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.W3W_GPG_PASSPHRASE }}
